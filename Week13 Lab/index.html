<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 13 - Form Validation</title>

    <style>
        .error {
            color: red;
            min-height: 1em;
        }

        .success {
            color: green;
        }

        form {
            display: grid;
            gap: 10px;
            max-width: 400px;
        }

        label {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Contact Form</h1>

    <!-- novalidate lets my JavaScript show the errors instead of the browser -->
    <form id="contactForm" novalidate>
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Your name" required>
        <p id="nameError" class="error"></p>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="you@example.com" required>
        <p id="emailError" class="error"></p>

        <label for="age">Age:</label>
        <input type="number" id="age" placeholder="Your age" min="1" required>
        <p id="ageError" class="error"></p>

        <button type="submit">Submit</button>
    </form>

    <p id="successMessage" class="success"></p>

    <script src="script.js"></script>
</body>
</html>
