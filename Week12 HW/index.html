<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Game Night Sign-Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Game Night Sign-Up</h1>

  <form id="signupForm">
    <label for="name">Name:</label>
    <input id="name" type="text" placeholder="Your name" required />
    <br>
    <br>

    <label for="email">Email:</label>
    <input id="email" type="email" placeholder="you@example.com" required />
    <br>
    <br>

    <label for="date">Night you can play:</label>
    <input id="date" type="date" required />
    <br>
    <br>

    <label for="game">Game:</label>
    <select id="game">
      <option value="Marvel Rivals">Marvel Rivals</option>
      <option value="Call of Duty">Call of Duty</option>
      <option value="Borderlands">Borderlands</option>
    </select>
    <br>
    <br>

    <label for="controller">I have my own controller:</label>
    <input id="controller" type="checkbox" />
    <br>
    <br>

    <label for="message">Message:</label>
    <textarea id="message" rows="4" placeholder="Anything else we should know?"></textarea>
    <br>
    <br>

    <button type="submit">Sign Me Up</button>
  </form>

  <section id="resultSection"></section>

  <script src="script.js"></script>
</body>
</html>
