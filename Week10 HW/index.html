<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Video Games — DOM Homework</title>
  <style>
    /* highlight class that gets toggled */
    .highlight-box { background: yellow; }
  </style>
</head>
<body>
  <header>
    <h1 id="game-title">Video Games Page</h1>
  </header>

  <main id="game-main">
    <p class="intro-text">Welcome! This page will update with JavaScript.</p>

    <!-- list we put the games into -->
    <ul id="game-list"></ul>

    <!-- image we swap with the button -->
    <img id="game-img" src="marvel.jpg" alt="Marvel Rivals" width="400" />

    <!-- paragraph for the challenge -->
    <p id="challenge-text">This text will change with JavaScript.</p>

    <!-- buttons -->
    <button id="highlight-btn">Toggle Highlight</button>
    <button id="swap-btn">Swap Image</button>
  </main>

  <footer id="game-footer">© 2026 Izaiah Kinslow</footer>

  <script src="scripts.js"></script>
</body>
</html>
