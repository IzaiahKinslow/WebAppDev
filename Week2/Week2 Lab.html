<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--linking .css files goes in the head tag-->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div>
        <!--a generic container, no meaning by itself. used for styling and layout-->
    </div>


    <!--semantic tags-->
    <header>
        <!--top section of the page or a section, usually with a logo/title/intro-->
    
    </header>

    <nav>
        <!--contains navigation links,
        tells the browser/screen readers "this is the site menu"-->
    </nav>

    <main>
        <!--this is the bread and butter of your website-->
    </main>

    <section>
        <!--section tags will be inside the <main> tags, groups related content
            this of it like chapters in a book-->
    </section>

    <footer>
        <!--bottom of the page or section,  usually with copyright or contact info-->
    </footer>

    <ul>
        <!--unordered lists, bullet points-->
    </ul>

    <ol>
        <!--ordered list, numbered-->
    </ol>

    <li>
        <!--List Item-->
    </li>

    <ul>
    <li>Oranges</li>
    <li>Apples</li>        
    </ul>


    <ol>
        <li>Pizza</li>
        <li>Burgers</li>
    </ol>

<table>
    <!--table container-->
</table>

<tr>
    <!--Table row-->
</tr>

<th>
    <!--table header-->
</th>

<td>
    <!--table data-->
</td>


<table border ="1px" >
<tr>
    <th>Column 1</th>
    <th>Column 2</th>
    <th>Column 1</th>
    <th>Column 2</th>
</tr>    
<tr>
    <td>data 1</td>
    <td>data 2</td>
    <td>data 1</td>
    <td>data 2</td>
</tr>
</table>




</body>
</html>
